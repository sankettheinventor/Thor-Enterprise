# THOR — Prometheus scrape + rules config. Point Prometheus at the plane's /metrics and load the alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: thor
    metrics_path: /metrics
    static_configs:
      # the control plane's dashboard surface (adjust host if Prometheus runs off-host)
      - targets: ["controlplane:7080"]
