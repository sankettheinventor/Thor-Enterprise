name: THOR CI

# ACTIVATION: copy this file to `.github/workflows/ci.yml` via the GitHub web UI (Actions -> New workflow
# -> paste), OR push it with a Personal Access Token that has the `workflow` scope. GitHub refuses a token
# WITHOUT that scope from creating files under `.github/workflows/`, so the canonical copy ships here in
# `docs/ci/` and the repo owner activates it once. (This is why a normal `git push` of the in-repo
# `.github/workflows/ci.yml` is rejected — not a code problem, a token-scope rule.)
#
# Standing safety net once active: the docker-free lane runs on every push/PR (a regression can't merge
# silently); a browser-smoke job renders the cockpit under the REAL CSP (the gap that let a dead cockpit
# pass the whole suite); a guard fails the build on any AI co-author trailer. The live lanes (`make prove`
# real Docker rooms + Postgres; `make launch` the attack campaign) are operator-run on a Docker host.
on:
  push:
    branches: [main, "qa/**"]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    name: docker-free suite + guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import sanity (every served + dormant surface)
        run: |
          python -c "import rbac, thor_http_auth, manager.api, selfaudit.api, wall.api, govengine.api, sdlc.api, scheduler.api, dashboard.dashboard_api; print('imports OK')"

      - name: Docker-free test lane (same as make qa)
        run: pytest -m 'not deferred' -q

      - name: Guard — no AI co-author trailers in this push's commits
        if: github.event_name == 'push'
        run: |
          # The human is the sole author (HCD). Fail if any commit added an AI Co-Authored-By trailer.
          range="${{ github.event.before }}..${{ github.sha }}"
          if git rev-parse "${{ github.event.before }}" >/dev/null 2>&1; then
            hits=$(git log "$range" --format='%(trailers:key=Co-Authored-By)' | grep -ic 'claude\|anthropic\|copilot\|gpt' || true)
          else
            hits=$(git log -1 --format='%(trailers:key=Co-Authored-By)' | grep -ic 'claude\|anthropic\|copilot\|gpt' || true)
          fi
          if [ "$hits" != "0" ]; then echo "AI co-author trailer found ($hits) — not allowed"; exit 1; fi
          echo "co-author guard: clean"

  browser-smoke:
    name: cockpit renders under real CSP (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      # The render test is @pytest.mark.deferred (it needs a browser); select it explicitly. It boots a
      # tiny server that serves cockpit.html behind the REAL dashboard CSP + stub endpoints (no Postgres),
      # and asserts the inline JS executes and nav switches panels in a CSP-enforcing browser.
      - name: Cockpit render + nav smoke
        run: pytest tests/integration/test_cockpit_render.py -m deferred -q
