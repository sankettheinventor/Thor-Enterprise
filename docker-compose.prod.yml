# THOR Enterprise — single-host production deployment (control plane + Postgres).
#
# Secrets come from the environment (or a .env file beside this one — NEVER commit it):
#   THOR_API_TOKEN       (required UNLESS using THOR_USERS) single bearer token for mutating endpoints
#   THOR_USERS           (optional) RBAC roster: JSON [{"id","role","token","pubkey"}] — viewer/operator/commander
#   THOR_PG_PASSWORD     (recommended) Postgres password   THOR_SELFAUDIT_PASSWORD (optional)
# Bring up:
#   export THOR_API_TOKEN=$(openssl rand -hex 32) THOR_PG_PASSWORD=$(openssl rand -hex 16)
#   docker compose -f docker-compose.prod.yml up -d --build
# Dashboard → http://127.0.0.1:7080/   (mutating calls require: Authorization: Bearer $THOR_API_TOKEN)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${THOR_PG_PASSWORD:-thor}
      POSTGRES_DB: thor
    volumes:
      - thor_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thor"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Scheduled Postgres backups — the ledger is THOR's source of truth (the tamper-evident audit chain), so
  # it must survive host loss. pg_dump runs on a schedule with retention; dumps land in the thor_pgbackups
  # volume. Restore (RUNBOOK): `gunzip -c <dump>.sql.gz | psql -U postgres -d thor`. Tune via env.
  pgbackup:
    image: prodrigestivill/postgres-backup-local:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: thor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${THOR_PG_PASSWORD:-thor}
      SCHEDULE: ${THOR_BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${THOR_BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${THOR_BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${THOR_BACKUP_KEEP_MONTHS:-12}
      HEALTHCHECK_PORT: 8080
    volumes:
      - thor_pgbackups:/backups
    restart: unless-stopped

  # Real git host (P5). THOR DECIDES (Sig-3 gates merge) + runs its OWN tests; Gitea only EXECUTES.
  gitea:
    image: gitea/gitea:1.21
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__OFFLINE_MODE: "true"
    volumes:
      - thor_gitea:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/v1/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    image: thor-controlplane:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # reach the compose Postgres by SERVICE NAME on the internal network
      THOR_PG_DSN: postgresql://postgres:${THOR_PG_PASSWORD:-thor}@postgres:5432/thor
      THOR_API_TOKEN: ${THOR_API_TOKEN:-}     # single-token posture; OR set THOR_USERS for per-user RBAC
      THOR_USERS: ${THOR_USERS:-}             # RBAC roster (viewer/operator/commander); see DEPLOYMENT.md
      THOR_OPERATOR_PUBKEYS: ${THOR_OPERATOR_PUBKEYS:-}
      THOR_SELFAUDIT_PASSWORD: ${THOR_SELFAUDIT_PASSWORD:-selfaudit}
      THOR_BIND_HOST: "0.0.0.0"        # surfaces must bind 0.0.0.0 to be reachable through ports
      # P5: point THOR at the live Gitea (leave THOR_GIT_BACKEND unset to use local-git).
      THOR_GIT_BACKEND: ${THOR_GIT_BACKEND:-local}
      GITEA_URL: http://gitea:3000
      GITEA_OWNER: ${GITEA_OWNER:-thor}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
    ports:
      - "7080:7080"   # cockpit / dashboard
      - "7100:7100"   # manager
      - "7140:7140"   # sentinel
      - "7150:7150"   # self-audit
    # The control plane provisions sealed ROOM containers as siblings via the host Docker daemon.
    # (On Kubernetes this is replaced by a k8s-native provisioner — see DEPLOYMENT.md.)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # TLS reverse proxy — REQUIRED for mobile push (Web Push needs HTTPS). Set THOR_SITE_ADDRESS in .env
  # (a domain → auto Let's Encrypt; an IP/localhost → Caddy's internal CA). See Caddyfile + RUNBOOK.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - controlplane
    ports:
      - "443:443"
      - "80:80"
    environment:
      THOR_SITE_ADDRESS: ${THOR_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists the issued certs + Caddy's internal root CA
      - caddy_config:/config
    restart: unless-stopped

volumes:
  thor_pgdata:
  thor_pgbackups:
  thor_gitea:
  caddy_data:
  caddy_config:
